<script id="shared">
(function(root){
const S={};
S.TILE=32; S.H=17; S.GROUND=14; S.GRAV=1400; S.MAXFALL=900; S.PW=20; S.PH=28;
S.LEVEL_COUNT=15; S.DARK=[4,8,11,13,15]; S.PLATES=[2,5,9,12,15];
S.STEP={range:112, cd:1.5, iframes:0.45, trail:0.4};
// ---- progression config (server-authoritative; points are earned only in online rooms) ----
S.BOSS_LEVELS=[5,10,15];
S.isBoss=n=>S.BOSS_LEVELS.indexOf(n)>=0;
S.difficulty=n=>Math.min(5,1+Math.floor((n-1)/3));                 // levels 2-15 -> 1..5
S.LEVEL_COST_CFG={a:40,b:20,bossMult:1.5,round:10};                // cost = (a*d^2 + b*(n-1)) * (boss?bossMult:1)
S.levelCost=n=>{if(n===1)return 0;const c=S.LEVEL_COST_CFG,d=S.difficulty(n);return Math.round((c.a*d*d+c.b*(n-1))*(S.isBoss(n)?c.bossMult:1)/c.round)*c.round;};
S.POINTS={levelClear:n=>10+10*S.difficulty(n),roundWin:15,bossKill:n=>50+25*S.difficulty(n),dailyCap:600};
S.BOSS={w:56,h:48,speed:0.6};
S.bossPos=(L,t)=>{const b=L.boss,half=(b.x1-b.x0-S.BOSS.w)/2,mid=(b.x0+b.x1-S.BOSS.w)/2;
  return{x:mid+Math.sin(t*S.BOSS.speed)*half*0.9,y:S.GROUND*S.TILE-S.BOSS.h-Math.abs(Math.sin(t*2.2))*44};};
S.atkBox=(x,y,face)=>({x:face>0?x+S.PW:x-30,y:y+2,w:30,h:24});
S.minClearTime=(L,speed)=>0.9*Math.max(0,L.exit.x-L.spawn.x)/(speed*1.35);
S.TIERS={Common:'#adb5bd',Uncommon:'#51cf66',Rare:'#339af0',Epic:'#cc5de8',Legendary:'#ffb627'};
const C=(name,tier,cost,speed,jump,hp,atk,body,accent,look,ability)=>({name,tier,cost,speed,jump,hp,atk,body,accent,look,ability:ability||null});
S.CHARS=[
C('Pip','Common',0,200,560,3,1,'#f2c14e','#fff3c4','ears'),
C('Bramble','Common',0,190,550,4,1,'#6aa84f','#cfe8b8','leaf'),
C('Tilly','Common',100,205,560,3,1,'#e07a5f','#f8d0c2','bow'),
C('Moss','Common',150,195,555,4,1,'#4e8d7c','#bfe3d6','cap'),
C('Rook','Common',200,200,565,3,2,'#7d7f9a','#d6d8e8','beak'),
C('Juniper','Common',250,210,570,3,1,'#5b8def','#cde0ff','hat'),
C('Ember','Uncommon',400,215,575,3,2,'#e8590c','#ffd8a8','flame'),
C('Coral','Uncommon',500,205,570,4,1,'#ff6b9a','#ffd1e0','fin'),
C('Flint','Uncommon',600,200,560,5,1,'#8d6e63','#d7ccc8','helm'),
C('Wren','Uncommon',700,220,585,3,1,'#c9a227','#f5e6b3','crest'),
C('Kestrel','Uncommon',800,225,580,3,2,'#3d5a80','#c6d4e6','beak'),
C('Sable','Rare',1100,220,585,4,2,'#2f2f3a','#9c9cb0','ears'),
C('Orrin','Rare',1300,205,575,5,2,'#b5651d','#f0c89a','horns'),
C('Lumen','Rare',1500,225,590,4,1,'#f7f06d','#fffde0','halo'),
C('Vesper','Rare',1700,230,590,4,2,'#6d597a','#d9c8e3','hood'),
C('Titan','Epic',2200,200,575,6,3,'#495057','#ced4da','helm','double'),
C('Aurora','Epic',2600,235,600,4,2,'#38d9a9','#d3f9ec','crown','double'),
C('Zephyr','Epic',3000,250,600,4,2,'#74c0fc','#e7f5ff','wing','double'),
C('Solstice','Epic',3400,230,595,5,3,'#f59f00','#fff3bf','crown','double'),
C('Nyx','Legendary',5000,235,600,4,2,'#1b1030','#3a1f5c','nyx','shadow')
];
S.NYX=19;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
S.rng=rng;
S.genLevel=function(n){
  const T=S.TILE,G=S.GROUND,h=S.H,r=rng(n*9973+7),ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const w=96+n*6, gh=new Array(w).fill(G);
  const L={n,w,h,t:new Array(w*h).fill(0),block:{},gems:[],keys:[],potions:[],doors:[],gates:[],plates:[],checkpoints:[],enemies:[],
    dark:S.DARK.indexOf(n)>=0,theme:Math.min(4,Math.floor((n-1)/3)),exit:null,spawn:{x:2*T,y:G*T-S.PH-0.01}};
  const set=(tx,ty,v)=>{if(tx>=0&&tx<w&&ty>=0&&ty<h)L.t[ty*w+tx]=v;};
  let gid=0,eid=0,pid=0;
  const gem=(x,y)=>L.gems.push({id:gid++,x,y});
  const enemy=(type,x,y)=>L.enemies.push({id:eid++,type,x,y});
  const dif=Math.min(1,(n-1)/12);
  const types=['flat','gap','spikes','step','plat','pillar','gap','plat'];
  if(L.dark)types.push('shadow','shadow','shadow');
  const boss=S.isBoss(n);let x=10,cp=false,puz=S.PLATES.indexOf(n)<0,keyPlaced=boss,pots=0,shadows=0;
  const endZone=boss?w-42:w-20;
  while(x<endZone){
    if(!cp&&x>=w*0.45){L.checkpoints.push({id:0,x:(x+3)*T+16,y:G*T});x+=7;cp=true;continue;}
    if(!puz&&x>=Math.min(w*0.6,endZone-30)&&x+18<endZone){
      const p1=x+2,p2=x+9,gx=x+13;
      L.plates.push({id:0,tx:p1,gate:'g0'},{id:1,tx:p2,gate:'g0'});
      L.gates.push({id:'g0',tx:gx,plates:[0,1]});
      for(let ty=0;ty<G;ty++){set(gx,ty,7);L.block[ty*w+gx]='g0';}
      for(let i=0;i<3;i++)gem((x+15)*T+16,(G-1-i)*T+16);
      x+=17;puz=true;continue;
    }
    let ty=types[Math.floor(r()*types.length)];
    if(L.dark&&shadows<2&&x>w*0.25)ty='shadow';
    if(ty==='flat'){const len=ri(5,8);for(let i=0;i<3;i++)gem((x+1+i)*T+16,(G-1)*T+12);
      if(r()<0.4+dif*0.4)enemy('slime',(x+len-2)*T,G*T-20.01);x+=len;}
    else if(ty==='gap'){const gw=ri(2,n>3?3:2);x+=2;for(let i=0;i<gw;i++){gh[x+i]=99;gem((x+i)*T+16,(G-3)*T+16);}x+=gw+2;}
    else if(ty==='spikes'){const sl=ri(2,n>5?3:2);x+=2;for(let i=0;i<sl;i++){set(x+i,G-1,3);gem((x+i)*T+16,(G-4)*T+16);}x+=sl+2;}
    else if(ty==='step'){const hg=ri(1,2),len=ri(4,7);x+=1;for(let i=0;i<len;i++){gh[x+i]=G-hg;if(i%2==0)gem((x+i)*T+16,(G-hg-1)*T+12);}
      if(r()<dif)enemy('slime',(x+1)*T,(G-hg)*T-20.01);x+=len+1;}
    else if(ty==='plat'){for(let i=2;i<=5;i++){set(x+i,G-3,2);gem((x+i)*T+16,(G-4)*T+16);}
      if(!keyPlaced&&cp&&r()<0.7){L.keys.push({id:0,x:(x+6)*T+16,y:(G-1)*T+12});keyPlaced=true;}
      else if(pots<2&&r()<0.4){L.potions.push({id:pid++,x:(x+7)*T+16,y:(G-1)*T+14});pots++;}
      if(n>=3&&r()<0.3+dif*0.5)enemy('bat',(x+4)*T,(G-7)*T);x+=8;}
    else if(ty==='pillar'){set(x+3,G-1,2);set(x+3,G-2,2);gem((x+3)*T+16,(G-3)*T+12);x+=6;}
    else if(ty==='shadow'){shadows++;
      for(let i=1;i<=5;i++)for(let j=G-5;j<=G-2;j++){const inner=i>=2&&i<=4&&j>=G-4&&j<=G-3;if(!inner)set(x+i,j,4);}
      for(let i=2;i<=4;i++)gem((x+i)*T+16,(G-3)*T+14);x+=8;}
  }
  if(boss){const bi=S.BOSS_LEVELS.indexOf(n);L.boss={x0:(w-40)*T,x1:(w-16)*T,hp:6*(bi+2),name:['Gem Warden','Crystal Warden','Shadow Warden'][bi]};
    L.keys.push({id:0,x:(w-28)*T+16,y:(G-1)*T+12,boss:true});}
  if(!keyPlaced)L.keys.push({id:0,x:(w-18)*T+16,y:(G-1)*T+12});
  const dx=w-14;for(let ty=0;ty<G;ty++){set(dx,ty,6);L.block[ty*w+dx]='d0';}L.doors.push({id:'d0',tx:dx});
  L.exit={x:(w-6)*T+16,y:G*T};
  for(let tx=0;tx<w;tx++){if(tx>=endZone)gh[tx]=G;if(gh[tx]<h)for(let ty=gh[tx];ty<h;ty++)set(tx,ty,1);}
  return L;
};
S.tileAt=(L,tx,ty)=>(tx<0||tx>=L.w)?1:((ty<0||ty>=L.h)?0:L.t[ty*L.w+tx]);
S.has=(o,id)=>!!o&&(typeof o.has==='function'?o.has(id):o.indexOf(id)>=0);
S.solid=(L,opened,tx,ty,shadowPass)=>{const v=S.tileAt(L,tx,ty);if(v===1||v===2)return true;if(v===4)return !shadowPass;
  if(v===6||v===7)return !S.has(opened,L.block[ty*L.w+tx]);return false;};
S.boxHits=(L,opened,x,y,w,h,shadowPass)=>{const T=S.TILE;
  for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-0.01)/T);ty++)for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-0.01)/T);tx++)
    if(S.solid(L,opened,tx,ty,shadowPass))return true;return false;};
// Shadow Step: walk along direction; solid walls stop the path (shadow tiles are passable mid-step);
// destination must be fully clear (not inside shadow either). Enemies & spikes are ignored.
S.stepTarget=(L,opened,x,y,dirx,diry)=>{const len=Math.hypot(dirx,diry)||1,ux=dirx/len,uy=diry/len;let best=null;
  for(let d=4;d<=S.STEP.range;d+=4){const nx=x+ux*d,ny=y+uy*d;
    if(S.boxHits(L,opened,nx,ny,S.PW,S.PH,true))break;
    if(!S.boxHits(L,opened,nx,ny,S.PW,S.PH,false))best={x:nx,y:ny,d};}
  return best&&best.d>=16?best:null;};
S.validateStep=(L,opened,fx,fy,tx,ty)=>{const d=Math.hypot(tx-fx,ty-fy);if(!(d>=1&&d<=S.STEP.range+2))return false;
  const n=Math.ceil(d/3);for(let i=1;i<=n;i++){const px=fx+(tx-fx)*i/n,py=fy+(ty-fy)*i/n;
    if(S.boxHits(L,opened,px+2,py+2,S.PW-4,S.PH-4,true))return false;}
  return !S.boxHits(L,opened,tx,ty,S.PW,S.PH,false);};
S.spawnFor=(L,slot)=>({x:L.spawn.x+slot*28,y:L.spawn.y});
root.GK=S;
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
(function(){
'use strict';
const GK=window.GK,T=GK.TILE,PW=GK.PW,PH=GK.PH,VW=960,VH=544;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const dk=document.createElement('canvas');dk.width=VW;dk.height=VH;const dcx=dk.getContext('2d');
const ui=document.getElementById('ui');
const qs=new URLSearchParams(location.search);
// ---------- profile (server-tracked points & unlocks; points are game-only, no currency/wallet/payout) ----------
// localStorage keeps: gk_pid (server-issued profile id), gk_cache (last profile snapshot, used offline), gk_save (hero picks).
function defSave(){return{sel:[0,1]};}
let save;try{save=Object.assign(defSave(),JSON.parse(localStorage.getItem('gk_save')||'{}'));}catch(e){save=defSave();}
function defProf(){return{pid:null,nick:null,points:0,lifetime:0,unlockedChars:[],unlockedLevels:[1],dayEarned:0,cap:GK.POINTS.dailyCap};}
let prof;try{prof=Object.assign(defProf(),JSON.parse(localStorage.getItem('gk_cache')||'null')||{});}catch(e){prof=defProf();}
function persist(){try{localStorage.setItem('gk_save',JSON.stringify({sel:save.sel}));}catch(e){}}
function cacheProf(){try{localStorage.setItem('gk_cache',JSON.stringify(prof));if(prof.pid)localStorage.setItem('gk_pid',prof.pid);}catch(e){}}
const isUnlocked=i=>GK.CHARS[i].cost===0||prof.unlockedChars.indexOf(i)>=0;
const levelUnlocked=n=>n===1||prof.unlockedLevels.indexOf(n)>=0;
function fixSel(){[0,1].forEach(i=>{if(!isUnlocked(save.sel[i]))save.sel[i]=i;});}fixSel();
// ---------- input ----------
const keys=new Set(),tapped=new Set();
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys.add(e.code);tapped.add(e.code);if(TOUCH&&!e.repeat&&e.code!=='Escape')document.body.classList.add('kbd');
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==='Escape'&&G.mode==='play')togglePause();});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
const MAPS={kb1:{l:['KeyA'],r:['KeyD'],j:['KeyW'],a:['KeyF'],i:['KeyG'],u:['KeyS'],s:['KeyE']},
  kb2:{l:['ArrowLeft'],r:['ArrowRight'],j:['ArrowUp'],a:['KeyK','Numpad1'],i:['KeyL','Numpad2'],u:['ArrowDown'],s:['KeyJ','Numpad3']}};
MAPS.all={};for(const k in MAPS.kb1)MAPS.all[k]=MAPS.kb1[k].concat(MAPS.kb2[k]);MAPS.all.j=MAPS.all.j.concat(['Space']);
const LABEL={kb1:{a:'F',i:'G',u:'S',s:'E'},kb2:{a:'K',i:'L',u:'↓',s:'J'},all:{a:'F',i:'G',u:'S',s:'E'},touch:{a:'ATK',i:'ITEM',u:'▼',s:'SPEC'}};
function readInput(p){const m=MAPS[p.ctrl],any=a=>a.some(k=>keys.has(k)||tapped.has(k));

   '<div class="help">'+(TOUCH?'<b>Touch</b> left pad: ◀ ▶ move, ▼ interact (hold next to a downed partner to revive) · right buttons: Jump, Attack, Item, Special (Shadow Step for Nyx) · ❚❚ pause<br>Local Co-op on a phone: you play P1 by touch, P2 needs a keyboard.<br>':'<b>P1</b> A/D move · W jump · F attack · G item · S interact · E special &nbsp;|&nbsp; <b>P2</b> ←/→ move · ↑ jump · K/Num1 attack · L/Num2 item · ↓ interact · J/Num3 special · Gamepads supported · Esc pause<br>')+'Points are earned only in online rooms (level clears, round wins, boss kills). 1P and Local Co-op play anything already unlocked.</div>');
  const bt=pn.querySelector('#bt'),lvl=()=>+pn.querySelector('#lv').value;
  bt.append(btn('1 Player',()=>startGame('solo',lvl()),'big'),btn(TOUCH?'Local Co-op (2P, P2 needs keyboard)':'Local Co-op (2P)',()=>startGame('coop',lvl()),'big'),btn('Online (Host / Join)',showOnline,'big'));
  pn.querySelector('#bt2').append(btn('Characters',()=>showChars(0)),btn('Levels',showLevels),btn('Profile',showProfile));
  bt.querySelector('button').focus();}
let pendingUnlock=null;
function requestUnlock(kind,id,cost){if(!online()||!prof.pid){flash(location.protocol==='file:'?'Unlocking needs the server (node server.js)':'Create a profile first (Profile)');return false;}
  if(prof.points<cost){flash('Need '+(cost-prof.points)+' more pts');return false;}
  const key=kind+id;if(pendingUnlock!==key){pendingUnlock=key;return true;}pendingUnlock=null;sendNet({t:'unlock',kind,id});return true;}
function showChars(tab){screen='chars';screenArg=tab;const pn=panel('<h2>Characters <span class="pts">'+(prof.pid?prof.points+' pts':'')+'</span></h2><div class="tabs"><button id="t0" class="'+(tab===0?'on':'')+'">P1 / Online</button><button id="t1" class="'+(tab===1?'on':'')+'">P2</button> <span id="back"></span></div><div class="grid" id="grid"></div>');
  pn.querySelector('#t0').onclick=()=>showChars(0);pn.querySelector('#t1').onclick=()=>showChars(1);
  const grid=pn.querySelector('#grid');
  GK.CHARS.forEach((ch,i)=>{const d=document.createElement('div');const un=isUnlocked(i),sel=save.sel[tab]===i;d.className='card'+(sel?' sel':'')+(un?'':' locked')+(ch.tier==='Legendary'?' legend':'');d.dataset.i=i;
    const c=document.createElement('canvas');c.width=60;c.height=38;d.appendChild(c);
    d.insertAdjacentHTML('beforeend','<div class="nm">'+ch.name+'</div><div class="tier" style="background:'+GK.TIERS[ch.tier]+'">'+ch.tier+'</div><div class="st">♥'+ch.hp+' ⚔'+ch.atk+' ➜'+ch.speed+' ▲'+ch.jump+'</div>'+
      (ch.ability==='shadow'?'<div class="ab">Shadow Step</div>':ch.ability==='double'?'<div class="ab">Double Jump</div>':'')+'<div class="cost">'+(un?(sel?'Selected':(ch.cost?'Owned':'Free')):(pendingUnlock==='char'+i?(TOUCH?'Tap to confirm':'Click to confirm'):ch.cost+' pts'))+'</div>');
    const g=c.getContext('2d');g.scale(1.25,1.25);drawChar(g,i,14,3,1,1,{});
    d.onclick=()=>{if(isUnlocked(i)){save.sel[tab]=i;persist();pendingUnlock=null;if(G.net&&tab===0)sendNet({t:'pick_char',char:i});showChars(tab);}else{const ok=requestUnlock('char',i,ch.cost);showChars(tab);}};
    grid.appendChild(d);});
  pn.querySelector('#back').append(btn('Back',()=>{pendingUnlock=null;showTitle();}));}
const THEME_OF=n=>['Meadow','Whisperwood','Caverns','Crystal Depths','Shadow Keep'][Math.min(4,Math.floor((n-1)/3))];
function showLevels(){screen='levels';let h='<h2>Levels <span class="pts">'+(prof.pid?prof.points+' pts':'')+'</span> <span id="back"></span></h2><div class="lgrid">';
  for(let n=1;n<=GK.LEVEL_COUNT;n++){const un=levelUnlocked(n),c=GK.levelCost(n),d=GK.difficulty(n),tags=[GK.isBoss(n)?'BOSS':'',GK.DARK.indexOf(n)>=0?'Dark':'',GK.PLATES.indexOf(n)>=0?'Twin plates':''].filter(Boolean).join(' · ');
    h+='<div class="lcard'+(un?'':' locked')+(GK.isBoss(n)?' boss':'')+'" data-n="'+n+'"><b>Level '+n+'</b><div>'+THEME_OF(n)+'</div><div class="diff">'+'★'.repeat(d)+'☆'.repeat(5-d)+'</div><div class="tg">'+(tags||'&nbsp;')+'</div><div class="cost">'+
      (un?'Unlocked':(pendingUnlock==='level'+n?(TOUCH?'Tap to confirm':'Click to confirm'):(levelUnlocked(n-1)?c+' pts':'🔒 '+c+' pts')))+'</div></div>';}
  const pn=panel(h+'</div><div class="sub">Unlock in order. Cost = (40·d² + 20·(n−1)) × 1.5 on boss levels, rounded to 10. In online rooms the host’s unlocks decide.</div>');
  pn.querySelectorAll('.lcard').forEach(el=>el.onclick=()=>{const n=+el.dataset.n;if(levelUnlocked(n))return;if(!levelUnlocked(n-1)){flash('Unlock level '+(n-1)+' first');return;}requestUnlock('level',n,GK.levelCost(n));showLevels();});
  pn.querySelector('#back').append(btn('Back',()=>{pendingUnlock=null;showTitle();}));}
function showProfile(){screen='profile';let h='<h2>Profile</h2>';
  if(prof.pid)h+='<div class="sub"><b>'+esc(prof.nick)+'</b> · ID <code id="pid">'+prof.pid+'</code></div><div>'+prof.points+' pts available · '+prof.lifetime+' earned lifetime · today '+prof.dayEarned+' / '+prof.cap+' (daily cap, resets at midnight Pacific)</div>'+
    '<div class="row">'+(prof.hasPin?'PIN is set.':'No PIN yet: set one so you can reclaim this profile on another device.')+' <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4-8 digits" size="9"><span id="sp"></span></div>';
  else h+='<div class="sub">Create a profile to earn points in online rooms. The server issues an ID that this browser keeps.</div><div class="row">Nickname <input id="nn" maxlength="12" placeholder="3-12 chars"> PIN (optional) <input id="np" type="password" inputmode="numeric" maxlength="8" size="9"><span id="cr"></span></div>';
  h+='<h3>Reclaim a profile</h3><div class="row">Nickname <input id="rn" maxlength="12"> PIN <input id="rp" type="password" inputmode="numeric" maxlength="8" size="9"><span id="rc"></span></div><div class="msg" id="ns"></div><div class="row" id="back"></div>';
  const pn=panel(h);if(!online())pn.querySelector('#ns').textContent=location.protocol==='file:'?'Profiles need the server (node server.js).':'Connecting…';
  const v=id=>(pn.querySelector('#'+id)||{}).value||'';
  if(pn.querySelector('#sp'))pn.querySelector('#sp').append(btn('Set PIN',()=>sendNet({t:'setpin',pin:v('pin')})));
  if(pn.querySelector('#cr'))pn.querySelector('#cr').append(btn('Create',()=>sendNet({t:'register',nick:v('nn').trim(),pin:v('np')})));
  pn.querySelector('#rc').append(btn('Reclaim',()=>sendNet({t:'reclaim',nick:v('rn').trim(),pin:v('rp')})));
  pn.querySelector('#back').append(btn('Back',showTitle));}
function flash(s){const m=document.createElement('div');m.className='flash';m.textContent=s;ui.appendChild(m);setTimeout(()=>m.remove(),1800);}
function showOnline(){screen='online';const pn=panel('<h2>Online</h2><div class="sub">'+profLine()+'</div>'+(prof.pid?'':'<div class="row">Guest name <input id="nm" maxlength="12" value="'+esc(localStorage.getItem('gk_name')||'Guest')+'"></div>')+'<div class="row">Character: <b>'+GK.CHARS[save.sel[0]].name+'</b> (change in Characters)</div>'+
  '<div class="row" id="h"></div><div class="row">Code <input id="cd" maxlength="4" size="5" style="text-transform:uppercase"><span id="j"></span></div><div class="msg" id="ns"></div><div class="row" id="b"></div>');
  const nm=()=>{const e=pn.querySelector('#nm');if(e)localStorage.setItem('gk_name',e.value);};
  pn.querySelector('#h').append(btn('Host a room',()=>{nm();netStart('host');},'big'));
  pn.querySelector('#j').append(btn('Join',()=>{nm();netStart('join');}));
  pn.querySelector('#b').append(btn('Back',()=>{leaveOnline();showTitle();}));
  if(!online())netStatus(location.protocol==='file:'?'Online play needs the server: run "node server.js" and open http://localhost:8080':'Connecting to server…');}
function netStatus(s){const e=document.getElementById('ns');if(e)e.textContent=s;else flash(s);}
function showLobby(){const N=G.net;if(!N)return;screen='lobby';const pn=panel('<h2>Room <span class="code" id="code">'+N.code+'</span></h2><div class="sub">Share this code. Up to 4 players. '+(N.host?'Your unlocks decide the playable levels.':'The host’s unlocks decide the playable levels.')+'</div><div id="pl" class="col"></div><div class="row" id="b"></div><div class="msg" id="ns">'+esc(N.lobbyMsg||'')+'</div>');
  pn.querySelector('#pl').innerHTML=N.lobby.map(p=>'<div class="lp">P'+(p.slot+1)+' · '+esc(p.name)+(p.guest?' (guest, no pts)':'')+' · '+GK.CHARS[p.char].name+(p.host?' (host)':'')+(p.id===N.id?' ← you':'')+'</div>').join('');
  const b=pn.querySelector('#b');if(N.host){const s=document.createElement('select');s.id='olv';for(let i=GK.LEVEL_COUNT;i>=1;i--)if(levelUnlocked(i))s.insertAdjacentHTML('beforeend','<option value="'+i+'">Level '+i+'</option>');b.append(s,btn('Start game',()=>{N.lobbyMsg='';sendNet({t:'start',level:+s.value});},'big'));}
  else b.insertAdjacentHTML('beforeend','<div class="sub">Waiting for host to start…</div>');b.append(btn('Leave',()=>{leaveOnline();showTitle();}));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function togglePause(){if(G.victory){quitToTitle();return;}if(G.kind==='online'){if(confirm('Leave the online room?'))quitToTitle();return;}G.paused=!G.paused;}
function quitToTitle(){leaveOnline();G.paused=false;G.victory=false;persist();showTitle();}
// ---------- loop ----------
let last=performance.now(),acc=0,lastSave=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;try{if(G.mode==='play'){acc+=dt;let n=0;while(acc>=1/60&&n<6){tick(1/60);acc-=1/60;n++;}if(n>=6)acc=0;}render();touchSync();}catch(e){console.error(e);G.errors.push(String(e&&e.stack||e));}requestAnimationFrame(frame);}
window.GKT.startGame=startGame;window.GKT.tryShadowStep=tryShadowStep;window.GKT.showTitle=showTitle;window.GKT.completeLevel=completeLevel;window.GKT.loadLevel=loadLevel;
window.GKT.online=online;window.GKT.TOUCH=TOUCH;window.GKT.touchClear=touchClear;showTitle();connectMeta();requestAnimationFrame(frame);
})();
</script>
</body></html>
