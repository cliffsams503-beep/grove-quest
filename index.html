<script id="shared">
(function(root){
const S={};
S.TILE=32; S.H=17; S.GROUND=14; S.GRAV=1400; S.MAXFALL=900; S.PW=20; S.PH=28;
S.LEVEL_COUNT=15; S.DARK=[4,8,11,13,15]; S.PLATES=[2,5,9,12,15];
S.STEP={range:112, cd:1.5, iframes:0.45, trail:0.4};
// background music per level (data-driven: add 'n:trackId' entries as tracks are written; ids live in audio.part.js GKA.TRACKS)
S.MUSIC={1:'meadowlight'};   // Glimmer Pond uses 'stillwater' (set in genPond)
// ---- progression config (server-authoritative; points are earned only in online rooms) ----
S.BOSS_LEVELS=[5,10,15];
S.isBoss=n=>S.BOSS_LEVELS.indexOf(n)>=0;
S.difficulty=n=>Math.min(5,1+Math.floor((n-1)/3));                 // levels 2-15 -> 1..5
S.LEVEL_COST_CFG={a:40,b:20,bossMult:1.5,round:10};                // cost = (a*d^2 + b*(n-1)) * (boss?bossMult:1)
S.levelCost=n=>{if(n===1)return 0;const c=S.LEVEL_COST_CFG,d=S.difficulty(n);return Math.round((c.a*d*d+c.b*(n-1))*(S.isBoss(n)?c.bossMult:1)/c.round)*c.round;};
S.POINTS={levelClear:n=>10+10*S.difficulty(n),roundWin:15,bossKill:n=>50+25*S.difficulty(n),dailyCap:600};
S.BOSS={w:56,h:48,speed:0.6};
// enemy roster (hitbox w/h in game units, hp). slime + bat are the originals; the rest are introduced by theme (see genLevel).
S.ENEMY={slime:{w:26,h:20,hp:2,name:'Slime'},bat:{w:24,h:16,hp:1,name:'Bat'},beetle:{w:24,h:18,hp:2,name:'Hopper Beetle'},hedgehog:{w:24,h:20,hp:2,name:'Bristle Roller'},
  crab:{w:28,h:18,hp:3,name:'Crystal Crab'},wisp:{w:20,h:20,hp:1,name:'Will-o-Wisp'},imp:{w:20,h:24,hp:2,name:'Shadow Imp'}};
S.ENEMY_TYPES=Object.keys(S.ENEMY);
S.ENEMY_EXTRA={2:['beetle'],3:['beetle'],4:['hedgehog'],5:['hedgehog'],6:['hedgehog','beetle'],7:['crab'],8:['crab'],9:['crab','hedgehog'],10:['crab'],11:['crab','crab'],12:['crab','hedgehog'],13:['imp'],14:['imp'],15:['imp','imp']};
S.SHOT={w:10,h:10,grav:600,flight:1.1};
// ground-spawn replacement odds by level (level 1 stays slimes only); air (bat) spawns become wisps on dark levels / Shadow Keep
S.enemyPool=n=>n<=1?[]:n<=3?[['beetle',0.35]]:n<=6?[['hedgehog',0.35],['beetle',0.2]]:n<=12?[['crab',0.35],['hedgehog',0.2],['beetle',0.1]]:[['imp',0.25],['crab',0.15],['hedgehog',0.15]];
// hidden 1-UPs: level -> [spot kind, difficulty]
S.LIFE_SPOTS={2:['ledge','Easy'],3:['sky','Medium'],5:['boss','Medium'],6:['wall','Medium'],8:['dark','Hard'],9:['spikes','Hard'],10:['boss','Hard'],12:['crack','Hard'],14:['sky','Hard'],15:['bosshigh','Very hard']};
// ---- hidden bonus rooms (items only: gems, potions, rare 1-UPs, weapons; never coins or points) ----
S.BONUS_ROOMS={2:{entry:'fake',loot:['weapon:boomerang','gems']},4:{entry:'crack',loot:['weapon:firewand','potion','gems']},7:{entry:'rune',loot:['weapon:icebow','gems','potion']},
  9:{entry:'fake',loot:['gems','life','gems']},11:{entry:'crack',loot:['weapon:shadowblade','gems']},13:{entry:'rune',loot:['potion','life','gems']}};
S.BONUS_GEMS=3;
// collectible weapons (per-run collection). Against bosses every weapon hits exactly like the normal attack, so boss balance is unchanged.
S.WEAPONS=[{id:'boomerang',name:'Boomerang',icon:'#e8a33d',cd:0.55,dmg:1,desc:'Thrown forward ~190px and curves back to you; hits on the way out and on the way back.'},
  {id:'firewand',name:'Fire Wand',icon:'#ff6b35',cd:0.6,dmg:2,desc:'Shoots a fireball straight ahead (2 damage) that bursts into embers.'},
  {id:'icebow',name:'Ice Bow',icon:'#74c0fc',cd:0.5,dmg:1,desc:'Fast ice arrow; the enemy it hits freezes solid for 2.5s (frozen enemies cannot hurt you).'},
  {id:'shadowblade',name:'Shadow Blade',icon:'#9d4edd',cd:0.45,dmg:2,desc:'A wide shadow sweep in front and behind you (2 damage), reaching higher than a normal swing.'}];
S.WEAPON=Object.fromEntries(S.WEAPONS.map(x=>[x.id,x]));
// ---- Glimmer Pond (fishing side level; not part of the 15-level progression; never awards points) ----
S.POND={id:'pond',name:'Glimmer Pond',dockY:12};
S.FISH_PRIZES=[{id:'fish',name:'Common fish',desc:'+10 pond score'},{id:'boot',name:'Old boot',desc:'junk (+1 score, a laugh)'},{id:'gems',name:'Gems x3',desc:'+3 session gems'},
  {id:'potion',name:'Potion',desc:'fills your item slot'},{id:'life',name:'1-UP',desc:'+1 extra life'},{id:'golden',name:'Golden Fish',desc:'trophy (local collection)'}];
// odds in % per dock zone (each row sums to 100). Walking further out changes which fish are nearby.
S.FISH_ZONES=[{name:'Shallows',x0:7,x1:18,odds:{fish:55,boot:25,gems:12,potion:6,life:1.5,golden:0.5}},
  {name:'Lily Bend',x0:18,x1:29,odds:{fish:50,boot:15,gems:18,potion:10,life:5,golden:2}},
  {name:'Deep End',x0:29,x1:40,odds:{fish:40,boot:8,gems:24,potion:13,life:10,golden:5}}];
S.fishZone=x=>{const tx=x/S.TILE;for(let i=0;i<S.FISH_ZONES.length;i++)if(tx<S.FISH_ZONES[i].x1)return i;return S.FISH_ZONES.length-1;};
S.rollPrize=(zone,u)=>{const o=S.FISH_ZONES[zone].odds;let a=0;for(const p of S.FISH_PRIZES){a+=o[p.id];if(u*100<a)return p.id;}return 'fish';};
S.genPond=function(){const T=S.TILE,DY=S.POND.dockY,w=40,h=S.H;
  const L={n:'pond',pond:true,w,h,t:new Array(w*h).fill(0),block:{},gems:[],keys:[],potions:[],doors:[],gates:[],plates:[],checkpoints:[],enemies:[],lives:[],
    dark:false,music:'stillwater',theme:0,exit:{x:2*T+16,y:DY*T},spawn:{x:4*T,y:DY*T-S.PH-0.01},water:{y:DY*T+46,x0:7*T}};
  for(let tx=0;tx<w;tx++)for(let ty=DY;ty<h;ty++){if(tx<7)L.t[ty*w+tx]=1;else if(ty===DY)L.t[ty*w+tx]=10;}
  return L;};
S.levelData=n=>n==='pond'?S.genPond():S.genLevel(n);
S.bossPos=(L,t)=>{const b=L.boss,half=(b.x1-b.x0-S.BOSS.w)/2,mid=(b.x0+b.x1-S.BOSS.w)/2;
  return{x:mid+Math.sin(t*S.BOSS.speed)*half*0.9,y:S.GROUND*S.TILE-S.BOSS.h-Math.abs(Math.sin(t*2.2))*44};};
S.atkBox=(x,y,face)=>({x:face>0?x+S.PW:x-30,y:y+2,w:30,h:24});
S.minClearTime=(L,speed)=>0.9*Math.max(0,L.exit.x-L.spawn.x)/(speed*1.35);
S.TIERS={Common:'#adb5bd',Uncommon:'#51cf66',Rare:'#339af0',Epic:'#cc5de8',Legendary:'#ffb627'};
const C=(name,tier,cost,speed,jump,hp,atk,body,accent,look,ability)=>({name,tier,cost,speed,jump,hp,atk,body,accent,look,ability:ability||null});
S.CHARS=[
C('Pip','Common',0,200,560,3,1,'#f2c14e','#fff3c4','ears'),
C('Bramble','Common',0,190,550,4,1,'#6aa84f','#cfe8b8','leaf'),
C('Tilly','Common',100,205,560,3,1,'#e07a5f','#f8d0c2','bow'),
C('Moss','Common',150,195,555,4,1,'#4e8d7c','#bfe3d6','cap'),
C('Rook','Common',200,200,565,3,2,'#7d7f9a','#d6d8e8','beak'),
C('Juniper','Common',250,210,570,3,1,'#5b8def','#cde0ff','hat'),
C('Ember','Uncommon',400,215,575,3,2,'#e8590c','#ffd8a8','flame'),
C('Coral','Uncommon',500,205,570,4,1,'#ff6b9a','#ffd1e0','fin'),
C('Flint','Uncommon',600,200,560,5,1,'#8d6e63','#d7ccc8','helm'),
C('Wren','Uncommon',700,220,585,3,1,'#c9a227','#f5e6b3','crest'),
C('Kestrel','Uncommon',800,225,580,3,2,'#3d5a80','#c6d4e6','beak'),
C('Sable','Rare',1100,220,585,4,2,'#2f2f3a','#9c9cb0','ears'),
C('Orrin','Rare',1300,205,575,5,2,'#b5651d','#f0c89a','horns'),
C('Lumen','Rare',1500,225,590,4,1,'#f7f06d','#fffde0','halo'),
C('Vesper','Rare',1700,230,590,4,2,'#6d597a','#d9c8e3','hood'),
C('Titan','Epic',2200,200,575,6,3,'#495057','#ced4da','helm','double'),
C('Aurora','Epic',2600,235,600,4,2,'#38d9a9','#d3f9ec','crown','double'),
C('Zephyr','Epic',3000,250,600,4,2,'#74c0fc','#e7f5ff','wing','double'),
C('Solstice','Epic',3400,230,595,5,3,'#f59f00','#fff3bf','crown','double'),
C('Nyx','Legendary',5000,235,600,4,2,'#1b1030','#3a1f5c','nyx','shadow')
];
S.NYX=19;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
S.rng=rng;
S.genLevel=function(n){
  const T=S.TILE,G=S.GROUND,h=S.H,r=rng(n*9973+7),ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const w=96+n*6, gh=new Array(w).fill(G);
  const L={n,w,h,t:new Array(w*h).fill(0),block:{},gems:[],keys:[],potions:[],doors:[],gates:[],plates:[],checkpoints:[],enemies:[],
    dark:S.DARK.indexOf(n)>=0,music:S.MUSIC[n]||null,theme:Math.min(4,Math.floor((n-1)/3)),exit:null,spawn:{x:2*T,y:G*T-S.PH-0.01}};
  const set=(tx,ty,v)=>{if(tx>=0&&tx<w&&ty>=0&&ty<h)L.t[ty*w+tx]=v;};
  let gid=0,eid=0,pid=0;
  const gem=(x,y)=>L.gems.push({id:gid++,x,y});
  const enemy=(type,x,y)=>L.enemies.push({id:eid++,type,x,y});
  const dif=Math.min(1,(n-1)/12);
  const types=['flat','gap','spikes','step','plat','pillar','gap','plat'];
  if(L.dark)types.push('shadow','shadow','shadow');
  const boss=S.isBoss(n);const segs=[];let x=10,cp=false,puz=S.PLATES.indexOf(n)<0,keyPlaced=boss,pots=0,shadows=0;
  const endZone=boss?w-42:w-20;
  while(x<endZone){
    if(!cp&&x>=w*0.45){L.checkpoints.push({id:0,x:(x+3)*T+16,y:G*T});x+=7;cp=true;continue;}
    if(!puz&&x>=Math.min(w*0.6,endZone-30)&&x+18<endZone){
      const p1=x+2,p2=x+9,gx=x+13;
      L.plates.push({id:0,tx:p1,gate:'g0'},{id:1,tx:p2,gate:'g0'});
      L.gates.push({id:'g0',tx:gx,plates:[0,1]});
      for(let ty=0;ty<G;ty++){set(gx,ty,7);L.block[ty*w+gx]='g0';}
      for(let i=0;i<3;i++)gem((x+15)*T+16,(G-1-i)*T+16);
      x+=17;puz=true;continue;
    }
    let ty=types[Math.floor(r()*types.length)];const sx=x;
    if(L.dark&&shadows<2&&x>w*0.25)ty='shadow';
    if(ty==='flat'){const len=ri(5,8);for(let i=0;i<3;i++)gem((x+1+i)*T+16,(G-1)*T+12);

    else if(ty==='gap'){const gw=ri(2,n>3?3:2);x+=2;for(let i=0;i<gw;i++){gh[x+i]=99;gem((x+i)*T+16,(G-3)*T+16);}x+=gw+2;}

function moveBody(b,w,h,dt){const L=G.L,o=G.world.opened;

// ---------- Shadow Step ----------
function tryShadowStep(p,inp){if(p.stepCd>0||p.downed)return false;
  let dx=inp.x,dy=(inp.j?-1:0)+(inp.u?1:0);if(!dx&&!dy)dx=p.face;
  const tg=GK.stepTarget(G.L,G.world.opened,p.x,p.y,dx,dy);if(!tg){toast('Shadow Step blocked');return false;}
  const fx=p.x,fy=p.y;p.x=tg.x;p.y=tg.y;p.vy=Math.min(p.vy,0)*0.3;p.stepCd=GK.STEP.cd;p.inv=Math.max(p.inv,GK.STEP.iframes);p.stepInv=GK.STEP.iframes;
  if(dx)p.face=dx>0?1:-1;
  shadowTrail(p.ci,fx,fy,p.x,p.y,p.face);SND('step');
  if(G.net){p.pendingStep={fx,fy};sendNet({t:'step',fx:+fx.toFixed(1),fy:+fy.toFixed(1),tx:+p.x.toFixed(1),ty:+p.y.toFixed(1)});sendState(p,true);}

      if(tg&&e.cd<=0&&e.onGround&&Math.abs(tg.y-e.y)<56){e.st=1;e.stT=0.4;e.face=Math.sign(tg.x-e.x)||1;}}
    if(e.st===1){e.vx=0;if(e.stT<=0){e.st=2;e.stT=1.4;}}
    else if(e.st===2){if(e.onGround&&!groundAt(e,e.face*18))e.face=-e.face;e.vx=e.face*(200+n*4);if(e.stT<=0){e.st=0;e.cd=1.4;}}
    moveBody(e,e.w,e.h,dt);if(e.hitWall)e.face=-e.face;break;}
  case 'crab':{grav();e.cd-=dt;const tg=nearestP(e,380);
    if(e.st===1){e.vx=0;e.stT-=dt;if(e.stT<=0){e.st=0;if(tg)throwShot(e,tg);e.cd=Math.max(2,3-n*0.06);}}
    else{const goal=e.hx+Math.sin(e.t*1.1)*30;e.vx=Math.max(-40,Math.min(40,(goal-e.x)*2));if(e.onGround&&e.vx&&!groundAt(e,Math.sign(e.vx)*16))e.vx=0;
      if(tg){e.face=tg.x>e.x?1:-1;if(e.cd<=0&&e.onGround){e.st=1;e.stT=0.4;}}}
    moveBody(e,e.w,e.h,dt);break;}
  case 'imp':{grav();e.cd-=dt;const tg=nearestP(e,320);
    if(e.st===1){e.vx=0;e.stT-=dt;if(e.stT<=0){impBlink(e,tg);e.st=2;e.stT=0.35;}}
    else if(e.st===2){e.vx=0;e.stT-=dt;if(e.stT<=0)e.st=0;}
    else{if(tg){e.face=tg.x>e.x?1:-1;e.vx=e.face*30;if(e.cd<=0&&e.onGround){e.st=1;e.stT=0.45;}}else e.vx=(e.face||-1)*20;
      if(e.onGround&&e.vx&&!groundAt(e,Math.sign(e.vx)*14)){e.vx=0;if(!tg)e.face=-e.face;}}
    moveBody(e,e.w,e.h,dt);if(e.hitWall&&!tg)e.face=-e.face;break;}}
  if(e.type!=='bat'&&e.type!=='wisp'&&e.y>L.h*T)e.alive=false;}
function throwShot(e,tg){const sx=e.x+e.w/2,sy=e.y-2,tx=tg.x+PW/2,ty=tg.y+PH/2,tf=GK.SHOT.flight;
  const vx=Math.max(-240,Math.min(240,(tx-sx)/tf)),vy=Math.max(-520,(ty-sy-0.5*GK.SHOT.grav*tf*tf)/tf);G.world.shots.push({x:sx,y:sy,vx,vy,life:3});SND('throw');}
function updShots(dt){const w=G.world,L=G.L;w.shots=w.shots.filter(q=>{q.vy+=GK.SHOT.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
  if(q.life<=0||q.y>L.h*T)return false;if(GK.solid(L,w.opened,Math.floor(q.x/T),Math.floor(q.y/T))){puff(q.x,q.y,'#a5d8ff',8);return false;}return true;});}
function impBlink(e,tg){if(!tg)return;const L=G.L,o=G.world.opened,dir=Math.sign(tg.x-e.x)||1;
  for(const d of [96,80,64,48]){let nx=e.x+dir*d;if(Math.abs(nx+e.w/2-(tg.x+PW/2))<30)nx=tg.x+PW/2-dir*36-e.w/2;
    if(!GK.boxHits(L,o,nx,e.y,e.w,e.h,false)&&GK.solid(L,o,Math.floor((nx+e.w/2)/T),Math.floor((e.y+e.h+4)/T))){puff(e.x+e.w/2,e.y+e.h/2,'#9d4edd',14);e.x=nx;e.cd=2.4;SND('blink');puff(e.x+e.w/2,e.y+e.h/2,'#2a0d45',14);return;}}
  e.cd=1.2;}
// ---------- Glimmer Pond: fishing side level (items only, never points) ----------
const FSC={charge:1,cast:2,wait:3,bite:4,reel:5,result:0,idle:0};
function trophies(){try{return Object.assign({golden:0,catches:0,boots:0},JSON.parse(localStorage.getItem('gk_trophies')||'{}'));}catch(e){return{golden:0,catches:0,boots:0};}}
function saveTrophies(t){try{localStorage.setItem('gk_trophies',JSON.stringify(t));}catch(e){}}
function initPond(){const L=G.L,R=GK.rng(4242);G.pondFish=[];for(let i=0;i<12;i++){const z=i%3,Z=GK.FISH_ZONES[z];G.pondFish.push({z,x:(Z.x0+1+R()*(Z.x1-Z.x0-2))*T,y:L.water.y+22+R()*60,v:(R()<0.5?-1:1)*(18+R()*22),s:0.7+z*0.25+R()*0.3,t:R()*9});}}
function tickPond(dt){const L=G.L;for(const f of G.pondFish||[]){const Z=GK.FISH_ZONES[f.z];f.t+=dt;let tgt=null;
    for(const p of G.players){const F=p.fish;if(F&&(F.st==='wait'||F.st==='bite')&&F.zone===f.z&&Math.abs(F.tx-f.x)<160)tgt=F;}
    if(tgt){f.x+=(tgt.tx-f.x)*dt*0.8;f.y+=(L.water.y+18-f.y)*dt*0.8;f.v=Math.sign(tgt.tx-f.x)*Math.abs(f.v)||f.v;}
    else{f.x+=f.v*dt;if(f.x<Z.x0*T+10||f.x>Z.x1*T-10)f.v=-f.v;f.y+=Math.sin(f.t)*6*dt;}}}
function onDock(p){return p.onGround&&p.x+PW/2>GK.FISH_ZONES[0].x0*T+6;}
function fishControl(p,inp,dt){const F=p.fish||(p.fish={st:'idle'}),L=G.L;
  if(F.st==='idle'){if(inp.ap){if(!onDock(p)){toast('Walk out onto the dock to cast');return false;}F.st='charge';F.c=0;return true;}return false;}
  if(F.st==='charge'){F.c=Math.min(1,F.c+dt/0.9);if(!inp.a){const dist=70+F.c*200;F.st='cast';F.k=0;F.tx=Math.max(GK.FISH_ZONES[0].x0*T+24,Math.min(L.w*T-20,p.x+PW/2+p.face*dist));F.zone=GK.fishZone(F.tx);SND('cast');}return true;}
  if(F.st==='cast'){F.k+=dt/0.55;if(F.k>=1){F.st='wait';F.wait=1.6+Math.random()*3.2;SND('plop');puff(F.tx,L.water.y,'#d0ebff',8);}return true;}
  if(F.st==='wait'){F.wait-=dt;if(inp.ap||inp.x){F.st='result';F.msg='Reeled in — nothing biting yet';F.rt=0.8;return true;}if(F.wait<=0){F.st='bite';F.win=0.85;SND('bite');puff(F.tx,L.water.y,'#fff',10);}return true;}
  if(F.st==='bite'){F.win-=dt;if(inp.ap){F.prize=GK.rollPrize(F.zone,Math.random());const hard={fish:0,boot:0,gems:1,potion:1,life:2,golden:3}[F.prize]||0;
      Object.assign(F,{st:'reel',hard,zw:0.36-hard*0.05,zc:0.5,zg:0.5,zt:0,m:0.35,mv:0,prog:0.35});SND('jump2');}
    else if(F.win<=0){F.st='result';F.msg='Too slow — it got away';F.rt=1.3;SND('noitem');}return true;}
  if(F.st==='reel'){F.mv=Math.max(-1.4,Math.min(1.4,F.mv+(inp.a?2.6:-2.2)*dt));F.m+=F.mv*dt;if(F.m<0){F.m=0;F.mv=0;}if(F.m>1){F.m=1;F.mv=0;}
    F.zt-=dt;if(F.zt<=0){F.zg=0.15+Math.random()*0.7;F.zt=0.6+Math.random()*(1.2-F.hard*0.2);}F.zc+=(F.zg-F.zc)*Math.min(1,dt*(1.2+F.hard*0.8));
    F.inZone=Math.abs(F.m-F.zc)<F.zw/2;F.prog+=(F.inZone?0.32:-0.24)*dt;
    if(F.prog>=1)landCatch(p,F);else if(F.prog<=0){F.st='result';F.msg='The line went slack — it got away';F.rt=1.4;SND('noitem');p.fishFails=(p.fishFails||0)+1;}return true;}
  if(F.st==='result'){F.rt-=dt;if(F.rt<=0)F.st='idle';return F.rt>0.5;}
  return false;}
function landCatch(p,F){const pr=GK.FISH_PRIZES.find(q=>q.id===F.prize);F.st='result';F.rt=1.8;F.msg='Caught: '+pr.name+'!';F.show=F.prize;p.catches++;SND('catch');
  if(AUTH())applyPrize(p,F.prize);else{sendNet({t:'ev',k:'catch:'+F.prize});applyPrize(p,F.prize,true);}
  if(p.local){const t=trophies();t.catches++;if(F.prize==='golden')t.golden++;if(F.prize==='boot')t.boots++;saveTrophies(t);}
  G.stats=G.stats||{};(G.stats.catches=G.stats.catches||[]).push(F.prize);}
// prizes are items only: score, gems for this session, a potion, a 1-UP, or a local Golden Fish trophy. Never points or anything monetary.
function applyPrize(p,id,localOnly){const w=G.world;

  else if(id==='potion'){if(!p.item)p.item='potion';else{p.fscore+=5;toast(p.name+' already has a potion (+5 score)');}}
  else if(id==='life'){p.lives++;sparkle(p.x+PW/2,p.y,'#ff8fab');}

function sendWorld(){const w=G.world,now=performance.now();if(now-(G.lastWorld||0)<66)return;G.lastWorld=now;

function applyWorld(m){const w=G.world;if(m.lvl!==w.lvl)return;
  let ng=0;for(const id of m.taken)if(!w.taken.has(id)){const g=G.L.gems[id];if(g){sparkle(g.x,g.y,'#5ce1e6');ng++;}}if(ng)gemSnd();

  if(m.bt)for(const id of m.bt)if(!w.bt.has(id)){const b=(G.L.bonus||[])[id];if(b){sparkle(b.x,b.y,'#fff3bf');SND(b.kind==='weapon'?'secret':b.kind==='life'?'oneup':b.kind==='gems'?'gem':'item');if(b.kind==='weapon')toast('New weapon: '+GK.WEAPON[b.wp].name+'!');}}
  w.bt=new Set(m.bt||[]);if(m.ar)w.ar=m.ar.filter(x=>GK.WEAPON[x]);w.pq=(m.pq||[]).map(a=>({k:WI[a[0]],x:a[1],y:a[2],vx:a[3],t:0}));
  w.gems=m.gems;w.lvlGems=m.lg;w.keys=m.keys;w.taken=new Set(m.taken);w.kt=new Set(m.kt);w.pt=new Set(m.pt);w.lt=new Set(m.lt||[]);w.shots=(m.sh||[]).map(a=>({x:a[0],y:a[1]}));
  for(const id of m.opened)if(!w.opened.has(id)){toast(id[0]==='g'?'Gate opened together!':id[0]==='b'?'The cracked wall crumbles!':'Door unlocked!');SND(id[0]==='d'?'door':'gate');}
  w.opened=new Set(m.opened);w.cp=m.cp;w.plates=m.pl||{};w.latch=m.lat||{};
  m.en.forEach((a,i)=>{const e=w.enemies[i];if(!e)return;const jump=Math.hypot(a[0]-e.tx,a[1]-e.ty)>48;e.tx=a[0];e.ty=a[1];if(jump){e.x=a[0];e.y=a[1];}if(e.alive&&!a[2]){puff(e.x+e.w/2,e.y+e.h/2,ECOL[e.type]||'#69db7c',14);SND('pop');fxHit(e.x+e.w/2,e.y+e.h/2,ECOL[e.type]||'#fff',4);}
    const st=a[4]|0;if(e.alive&&a[2]){if(e.type==='crab'&&e.st===1&&st===0)SND('throw',{vol:0.8});if(e.type==='imp'&&e.st!==2&&st===2){SND('blink',{vol:0.8});puff(e.x+10,e.y+12,'#9d4edd',12);}}e.st=st;e.frz=a[5]?1:0;e.alive=!!a[2];e.face=a[3];});
  for(const a of m.ps){const p=G.players.find(q=>q.id===a[0]);if(!p)continue;if(a[1]<p.hp&&!p.downed){puff(p.x+PW/2,p.y+PH/2,'#ff6b6b',8);if(p.local){shake(5);G.hurtFlash=0.22;}SND('hurt',{vol:p.local?1:0.55});}if(!!a[2]!==p.downed)SND(a[2]?'down':'revive');
    if(a[7]!=null){if(a[7]<p.lives&&!a[2]){sparkle(p.x+PW/2,p.y+PH/2,'#ff8fab');p.lifeFx=1.2;SND('revive');}p.lives=a[7];}if(a[8]!=null)p.wpn=a[8]?WI[a[8]-1]:null;
    p.hp=a[1];p.downed=!!a[2];if(!p.local||!p.stepInv)p.inv=a[3]?Math.max(p.inv,0.1):p.inv;p.item=a[4]?'potion':null;p.rev=a[5];p.downT=a[6];}

function onNet(m){const N=G.net;if(!N&&['hosted','joined','cfg','profile','noprofile','err','awards'].indexOf(m.t)<0)return;switch(m.t){
  case 'hosted':G.net={id:m.id,code:m.code,host:true,lobby:m.players};showLobby();break;
  case 'joined':G.net={id:m.id,code:m.code,host:false,lobby:m.players};showLobby();break;
  case 'lobby':N.lobby=m.players;if(G.mode!=='play')showLobby();break;
  case 'err':netStatus(m.msg);break;
  case 'cfg':G.cfg=m;break;
  case 'profile':prof=Object.assign(defProf(),m.profile);cacheProf();fixSel();
    if(qs.get('dev')==='1'&&G.cfg.dev&&!G.devAsked){G.devAsked=true;sendNet({t:'dev'});}
    if(m.reclaimed)flash('Profile reclaimed: '+prof.nick);if(m.created)flash('Profile created: '+prof.nick);if(m.pinset)flash('PIN saved');
    if(G.mode!=='play')refreshMenu();break;
  case 'noprofile':break;
  case 'awards':{const mine=m.items.filter(i=>G.net&&i.id===G.net.id);for(const i of m.items)if(i.granted<i.pts&&G.net&&i.id===G.net.id)toast('Daily cap reached: +'+i.granted+' of '+i.pts+' pts');
    const txt=m.items.map(i=>i.nick+' +'+i.granted+' ('+i.ev+')').join(' · ');if(txt)G.award={text:txt,t:5};if(m.note)toast(m.note);G.awardLog=(G.awardLog||[]).concat(m.items);break;}
  case 'boss':{const B=G.world&&G.world.boss;if(!B)return;if(m.hp<B.hp){puff(GK.bossPos(G.L,B.el).x+28,GK.bossPos(G.L,B.el).y+20,'#ffe066',10);SND('bossHit');}
    if(m.active&&!B.active){toast(G.L.boss.name+' awakens!');SND('bossAwaken');}B.hp=m.hp;B.max=m.max;B.active=!!m.active;B.el=m.el;if(m.dead)bossDown();break;}
  case 'tpno':{const p=G.players.find(q=>q.id===m.id);if(p){p.x=m.x;p.y=m.y;}break;}
  case 'runend':G.mode='menu';G.L=null;G.net.lobbyMsg=m.msg;showLobby();break;
  case 'start':startGame('online',m.level,m.players);break;
  case 'st':{const p=G.players.find(q=>q.id===m.id);if(!p||p.local)return;p.buf.push({t:performance.now(),x:m.x,y:m.y,f:m.f,m:m.m,a:m.a});if(p.buf.length>30)p.buf.shift();
    if(m.a&&!p.netA&&!(G.L&&G.L.pond))SND('attack',{vol:0.55});p.x=m.x;p.y=m.y;p.face=m.f;p.ih=!!m.ih;p.netA=m.a;p.netM=m.m;p.netFs=m.fs|0;p.netBx=m.bx|0;break;}
  case 'ev':{const p=G.players.find(q=>q.id===m.id);if(!p||!N||!N.host)return;if(m.k==='atk'){p.atkT=0.2;doAttack(p);}else if(m.k==='item')doItem(p);else if(m.k==='int')doInteract(p);else if(m.k.slice(0,6)==='catch:'&&G.L&&G.L.pond)applyPrize(p,m.k.slice(6));else if(m.k.slice(0,4)==='wpn:'){const id=m.k.slice(4);p.wpn=id&&G.world.ar.indexOf(id)>=0?id:null;}break;}
  case 'world':if(!N.host&&G.mode==='play')applyWorld(m);break;
  case 'tp':case 'fix':{const p=me();if(p&&(m.t==='fix'||m.id===p.id)){p.x=m.x;p.y=m.y;p.vx=p.vy=0;if(m.t==='fix'){G.stats=G.stats||{};G.stats.fixes=(G.stats.fixes||0)+1;}}break;}
  case 'step':{const p=G.players.find(q=>q.id===m.id);if(!p||p.local)return;SND('step',{vol:0.6});shadowTrail(p.ci,m.fx,m.fy,m.tx,m.ty,m.tx>=m.fx?1:-1);p.x=m.tx;p.y=m.ty;p.buf=[{t:performance.now(),x:m.tx,y:m.ty,f:p.face}];
    if(N.host){p.inv=Math.max(p.inv,GK.STEP.iframes);p.stepInv=GK.STEP.iframes;}break;}
  case 'stepok':G.stats=G.stats||{};G.stats.stepOk=(G.stats.stepOk||0)+1;break;
  case 'stepno':{const p=me();G.stats=G.stats||{};G.stats.stepNo=(G.stats.stepNo||0)+1;if(p){p.x=m.x;p.y=m.y;p.vx=p.vy=0;p.stepCd=Math.max(p.stepCd,0.3);}toast('Shadow Step rejected by server');break;}
  case 'level':if(G.mode==='play')goLevel(m.n);break;
  case 'left':G.players=G.players.filter(p=>p.id!==m.id);toast('A player left');if(N.lobby)N.lobby=N.lobby.filter(p=>p.id!==m.id);if(G.mode!=='play')showLobby();break;
  case 'closed':G.net=null;showTitle('Room closed: host left.');break;}}
function connectMeta(){if(location.protocol==='file:'||G.ws)return;

  ws.onerror=()=>{};}

function drawEnemy(g,e){const D=GK.ENEMY[e.type],t=G.time;let f=0,rot=0,alpha=1,dy=0;
  switch(e.type){case 'slime':f=Math.floor((t*8+e.id)%4);break;case 'bat':f=Math.floor((t*14+e.id)%4);break;case 'beetle':f=e.st?1:0;break;
    case 'hedgehog':f=e.st>=1?2:Math.floor(t*6)%2;if(e.st===2)rot=t*14;break;case 'crab':f=e.st===1?2:Math.floor(t*5+e.id)%2;break;
    case 'wisp':f=Math.floor((t*9+e.id)%3);alpha=0.6+0.3*Math.sin(t*3+e.id);dy=Math.sin(t*2.5+e.id)*2;break;case 'imp':f=e.st===1?2:Math.floor(t*3+e.id)%2;if(e.st===1)alpha=0.55+0.45*Math.sin(t*40);break;}
  const s=getESprite(e.type,f);g.save();g.globalAlpha*=alpha;g.translate(e.x+D.w/2,e.y+D.h/2+dy);if(e.face<0)g.scale(-1,1);if(rot)g.rotate(rot);g.imageSmoothingEnabled=true;g.drawImage(s,-ESPR.OX-D.w/2,-ESPR.OY-D.h/2,ESPR.W,ESPR.H);g.restore();}

  if(prof.pid)h+='<div class="sub"><b>'+esc(prof.nick)+'</b> · ID <code id="pid">'+prof.pid+'</code></div><div>'+prof.points+' pts available · '+prof.lifetime+' earned lifetime · today '+prof.dayEarned+' / '+prof.cap+' (daily cap, resets at midnight Pacific)</div>'+
    '<div class="row">'+(prof.hasPin?'PIN is set.':'No PIN yet: set one so you can reclaim this profile on another device.')+' <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4-8 digits" size="9"><span id="sp"></span></div>';
  else h+='<div class="sub">Create a profile to earn points in online rooms. The server issues an ID that this browser keeps.</div><div class="row">Nickname <input id="nn" maxlength="12" placeholder="3-12 chars"> PIN (optional) <input id="np" type="password" inputmode="numeric" maxlength="8" size="9"><span id="cr"></span></div>';
  h+='<h3>Reclaim a profile</h3><div class="row">Nickname <input id="rn" maxlength="12"> PIN <input id="rp" type="password" inputmode="numeric" maxlength="8" size="9"><span id="rc"></span></div><div class="msg" id="ns"></div><div class="row" id="back"></div>';
  const pn=panel(h);if(!online())pn.querySelector('#ns').textContent=location.protocol==='file:'?'Profiles need the server (node server.js).':'Connecting…';
  const v=id=>(pn.querySelector('#'+id)||{}).value||'';
  if(pn.querySelector('#sp'))pn.querySelector('#sp').append(btn('Set PIN',()=>sendNet({t:'setpin',pin:v('pin')})));
  if(pn.querySelector('#cr'))pn.querySelector('#cr').append(btn('Create',()=>sendNet({t:'register',nick:v('nn').trim(),pin:v('np')})));
  pn.querySelector('#rc').append(btn('Reclaim',()=>sendNet({t:'reclaim',nick:v('rn').trim(),pin:v('rp')})));
  pn.querySelector('#back').append(btn('Back',showTitle));}
function flash(s){const m=document.createElement('div');m.className='flash';m.textContent=s;ui.appendChild(m);setTimeout(()=>m.remove(),1800);}
function showOnline(){screen='online';const pn=panel('<h2>Online</h2><div class="sub">'+profLine()+'</div>'+(prof.pid?'':'<div class="row">Guest name <input id="nm" maxlength="12" value="'+esc(localStorage.getItem('gk_name')||'Guest')+'"></div>')+'<div class="row">Character: <b>'+GK.CHARS[save.sel[0]].name+'</b> (change in Characters)</div>'+
  '<div class="row" id="h"></div><div class="row">Code <input id="cd" maxlength="4" size="5" style="text-transform:uppercase"><span id="j"></span></div><div class="msg" id="ns"></div><div class="row" id="b"></div>');
  const nm=()=>{const e=pn.querySelector('#nm');if(e)localStorage.setItem('gk_name',e.value);};
  pn.querySelector('#h').append(btn('Host a room',()=>{nm();netStart('host');},'big'));
  pn.querySelector('#j').append(btn('Join',()=>{nm();netStart('join');}));
  pn.querySelector('#b').append(btn('Back',()=>{leaveOnline();showTitle();}));
  if(!online())netStatus(location.protocol==='file:'?'Online play needs the server: run "node server.js" and open http://localhost:8080':'Connecting to server…');}
function netStatus(s){const e=document.getElementById('ns');if(e)e.textContent=s;else flash(s);}
function showLobby(){const N=G.net;if(!N)return;screen='lobby';const pn=panel('<h2>Room <span class="code" id="code">'+N.code+'</span></h2><div class="sub">Share this code. Up to 4 players. '+(N.host?'Your unlocks decide the playable levels.':'The host’s unlocks decide the playable levels.')+'</div><div id="pl" class="col"></div><div class="row" id="b"></div><div class="msg" id="ns">'+esc(N.lobbyMsg||'')+'</div>');
  pn.querySelector('#pl').innerHTML=N.lobby.map(p=>'<div class="lp">P'+(p.slot+1)+' · '+esc(p.name)+(p.guest?' (guest, no pts)':'')+' · '+GK.CHARS[p.char].name+(p.host?' (host)':'')+(p.id===N.id?' ← you':'')+'</div>').join('');
  const b=pn.querySelector('#b');if(N.host){const s=document.createElement('select');s.id='olv';for(let i=GK.LEVEL_COUNT;i>=1;i--)if(levelUnlocked(i))s.insertAdjacentHTML('beforeend','<option value="'+i+'">Level '+i+'</option>');s.insertAdjacentHTML('beforeend','<option value="pond">Glimmer Pond (fishing)</option>');b.append(s,btn('Start game',()=>{N.lobbyMsg='';sendNet({t:'start',level:s.value==='pond'?'pond':+s.value});},'big'));}
  else b.insertAdjacentHTML('beforeend','<div class="sub">Waiting for host to start…</div>');b.append(btn('Leave',()=>{leaveOnline();showTitle();}));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function togglePause(){if(G.victory){quitToTitle();return;}if(G.kind==='online'){if(confirm('Leave the online room?'))quitToTitle();return;}G.paused=!G.paused;}
function quitToTitle(){leaveOnline();G.paused=false;G.victory=false;persist();showTitle();}
// ---------- sound: music follows the level's data-driven track; HUD speaker button + popover ----------
const sndB=document.createElement('button'),sndP=document.createElement('div');sndB.id='sndb';sndB.type='button';sndB.title='Sound (M toggles music)';sndB.setAttribute('aria-label','Sound settings');
sndP.id='sndp';sndP.className='panel';sndP.innerHTML='<h3>Sound</h3>'+(window.GKA?GKA.controlsHTML():'')+(TOUCH?'':'<div class="help">M: music on/off</div>');(TOUCH?document.body:wrapEl).append(sndB,sndP);
if(window.GKA){GKA.bindControls(sndP,()=>{if(!TOUCH)cv.focus();});}
const sndIcon=()=>{if(!window.GKA)return;const s=GKA.settings,off=(s.musicMuted||!s.music)&&(s.sfxMuted||!s.sfx);sndB.textContent=off?'🔇':(s.musicMuted||!s.music)?'🔈':'🔊';};sndIcon();if(window.GKA)GKA._A.listeners.push(sndIcon);
sndB.addEventListener('click',e=>{e.stopPropagation();sndP.classList.toggle('open');sndB.blur();if(!sndP.classList.contains('open')&&!TOUCH)cv.focus();});
sndB.addEventListener('pointerdown',e=>e.stopPropagation());
document.addEventListener('pointerdown',e=>{if(sndP.classList.contains('open')&&!sndP.contains(e.target)&&e.target!==sndB)sndP.classList.remove('open');});
function sndSync(){const pl=G.mode==='play'&&!!G.L;if(window.GKA)GKA.want(pl&&!G.victory?G.L.music:null,pl&&G.paused);
  if(!TOUCH&&pl){const pp=document.getElementById('pausep');if(G.paused&&!pp&&!G.victory)showPausePanel();else if(!G.paused&&pp)ui.innerHTML='';}
  if(sndP.classList.contains('open')&&pl&&G.paused)sndP.classList.remove('open');}
window.GKT.sndSync=()=>sndSync();window.GKT.fx={low:FXLOW,reduced:REDUCED,bgScale:BGS};
// ---------- loop ----------
let last=performance.now(),acc=0,lastSave=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;try{if(G.mode==='play'){acc+=dt;let n=0;while(acc>=1/60&&n<6){tick(1/60);acc-=1/60;n++;}if(n>=6)acc=0;}render();touchSync();sndSync();}catch(e){console.error(e);G.errors.push(String(e&&e.stack||e));}requestAnimationFrame(frame);}
window.GKT.startGame=startGame;window.GKT.tryShadowStep=tryShadowStep;window.GKT.showTitle=showTitle;window.GKT.completeLevel=completeLevel;window.GKT.loadLevel=loadLevel;
window.GKT.online=online;window.GKT.TOUCH=TOUCH;window.GKT.touchClear=touchClear;showTitle();connectMeta();requestAnimationFrame(frame);
})();
</script>
</body></html>
